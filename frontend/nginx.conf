# Cache-Control por tipo de recurso, resolvido aqui em vez de num add_header
# dentro de cada location. O motivo é uma armadilha do nginx: um bloco que declara
# qualquer add_header NÃO herda os add_header do bloco pai. Ter Cache-Control no
# location e segurança no server faria os cabeçalhos de segurança desaparecerem
# justamente nas rotas que servem o HTML.
map $uri $cache_control {
    # Assets com hash no nome: o conteúdo nunca muda sob o mesmo nome.
    ~^/assets/  "public, max-age=31536000, immutable";
    # Vazio nas rotas de API: quem manda no cache da resposta é o backend, que já
    # envia o próprio Cache-Control. add_header com valor vazio é ignorado pelo
    # nginx, então isto evita a resposta sair com o cabeçalho duplicado.
    ~^/api/     "";
    # O index.html aponta para os assets com hash. Sem no-cache o browser
    # reaproveita o HTML antigo depois de um deploy e vai buscar hashes que já não
    # existem — tela branca até limpar o cache. É a falha de produção mais provável
    # deste arquivo.
    default     "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Comprime o que compensa: o bundle JS sai de ~208kB para ~65kB.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Todos os add_header ficam neste nível, e nenhum location declara os seus —
    # ver o comentário do map acima.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # frame-ancestors no lugar de X-Frame-Options, que está obsoleto. O JWT vive em
    # localStorage, então um XSS entrega a sessão inteira — a CSP é a mitigação mais
    # barata disponível aqui. 'unsafe-inline' em style-src é necessário: o Detalhe
    # injeta a URL do pôster como custom property inline, e o index.html carrega a
    # folha do Google Fonts.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # /api vai para o backend pelo nome do serviço no compose. Mesmo papel do
    # proxy do vite.config.ts em dev: mesma origem, então não precisa de CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Sem estes o backend só enxerga o IP do container do nginx, e o log de
        # acesso e qualquer decisão baseada em origem ficam cegos.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # react-router: /titulo/7 e /gerenciar não são arquivos. Sem este fallback,
    # recarregar qualquer rota que não seja "/" devolve 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
